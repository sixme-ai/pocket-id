name: Pocket ID Linux Local Agent Installer (.run)

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/local-agent-bundle.yml
      - scripts/local-agent/**
      - backend/**
      - frontend/**
      - .node-version
      - .version
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    branches:
      - dev
    paths:
      - scripts/local-agent/**
      - .github/workflows/local-agent-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-id-local-agent-bundle
  cancel-in-progress: true

jobs:
  linux-amd64:
    name: Build, real smoke test and publish .run
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Pocket ID Git sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node and Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download all frontend dependencies
        run: vp install --frozen-lockfile

      - name: Build embedded frontend
        run: |
          vp -C frontend run build
          test -s backend/frontend/dist/index.html

      - name: Compile and test real Go backend
        working-directory: backend
        env:
          GOMAXPROCS: "2"
          CGO_ENABLED: "0"
        run: |
          go mod download
          go test -p=2 -tags=exclude_frontend,unit ./internal/apikey ./internal/usersignup ./internal/api ./internal/oidc
          mkdir -p ../dist/local-agent
          go build -p=2 -trimpath \
            -ldflags="-w -s -X github.com/pocket-id/pocket-id/backend/internal/common.Version=$(cat ../.version)" \
            -o ../dist/local-agent/pocket-id ./cmd

      - name: Freeze OAuth bootstrap with its Python runtime
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pocket-bootstrap-venv"
          "$RUNNER_TEMP/pocket-bootstrap-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'pyinstaller==6.16.0' 'cryptography==46.0.3'
          "$RUNNER_TEMP/pocket-bootstrap-venv/bin/pyinstaller" --noconfirm --clean --onefile --name bootstrap \
            --distpath dist/local-agent --workpath "$RUNNER_TEMP/pyinstaller-work" \
            --specpath "$RUNNER_TEMP" scripts/local-agent/bootstrap.py
          test -x dist/local-agent/bootstrap

      - name: Assemble self-starting localhost test bundle
        run: |
          set -euo pipefail
          cp scripts/local-agent/{start.sh,stop.sh,README.txt} dist/local-agent/
          cp LICENSE dist/local-agent/LICENSE.pocket-id
          chmod 700 dist/local-agent/pocket-id
          chmod 700 dist/local-agent/start.sh dist/local-agent/stop.sh dist/local-agent/bootstrap
          python3 -m py_compile scripts/local-agent/bootstrap.py
          bash -n dist/local-agent/start.sh dist/local-agent/stop.sh
          test ! -e dist/local-agent/shared-admin-key.txt
          test ! -e dist/local-agent/.env

      - name: Create self-extracting Linux .run installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/local-agent/installer-header.sh
          test ! -e dist/local-agent/.env
          test ! -e dist/local-agent/shared-admin-key.txt
          tar --create --gzip --file "$RUNNER_TEMP/pocket-id-local-agent.tar.gz" --directory dist local-agent
          archive_sha="$(sha256sum "$RUNNER_TEMP/pocket-id-local-agent.tar.gz" | cut -d ' ' -f 1)"
          sed "s/__ARCHIVE_SHA256__/$archive_sha/" scripts/local-agent/installer-header.sh \
            > dist/pocket-id-local-agent-linux-amd64.run
          printf '\n__POCKET_ID_ARCHIVE_BELOW__\n' >> dist/pocket-id-local-agent-linux-amd64.run
          cat "$RUNNER_TEMP/pocket-id-local-agent.tar.gz" >> dist/pocket-id-local-agent-linux-amd64.run
          chmod 700 dist/pocket-id-local-agent-linux-amd64.run
          test -x dist/pocket-id-local-agent-linux-amd64.run
          dist/pocket-id-local-agent-linux-amd64.run --help

      - name: Install real .run and verify OIDC, OAuth, negative and idempotence
        shell: bash
        run: |
          set -euo pipefail
          installer="$PWD/dist/pocket-id-local-agent-linux-amd64.run"
          location="$RUNNER_TEMP/pocket-id-run-real"
          trap 'if [[ -x "$location/stop.sh" ]]; then "$location/stop.sh" >/dev/null 2>&1 || true; fi' EXIT
          POCKET_ID_INSTALL_DIR="$location" timeout 180s "$installer" > "$RUNNER_TEMP/first-start.log" 2>&1 || {
            echo "First .run startup failed"
            sed -E 's@/lc/[A-Za-z0-9_-]+@/lc/REDACTED@g' "$RUNNER_TEMP/first-start.log" | tail -60
            tail -60 "$location/logs/pocket-id.log" 2>/dev/null || true
            exit 1
          }
          grep -Fq 'OIDC/JWKS, local human setup, M2M OAuth and wrong-secret denial: PASS' "$RUNNER_TEMP/first-start.log"
          test -x "$location/pocket-id"
          test -x "$location/bootstrap"
          test -s "$location/.installer-archive.sha256"
          test ! -e "$location/shared-admin-key.txt"
          test "$(stat -c '%a' "$location/.env")" = 600
          grep -Eq '^STATIC_API_KEY=[0-9a-f]{64}$' "$location/.env"
          grep -Fxq 'ACTORS_HOST=127.0.0.1' "$location/.env"
          grep -Fxq 'ACTORS_PORT=1414' "$location/.env"
          grep -Fq 'bind=127.0.0.1:1414' "$location/logs/pocket-id.log"
          if grep -Fq 'bind=0.0.0.0:1414' "$location/logs/pocket-id.log"; then
            echo 'Actor transport unexpectedly exposed on all interfaces: FAIL'
            exit 1
          fi
          test -s "$location/.login-link.txt"
          test -s "$location/.local-oauth.json"
          POCKET_ID_INSTALL_DIR="$location" timeout 60s "$installer" > "$RUNNER_TEMP/second-start.log" 2>&1
          grep -Fq 'Initial human administrator already exists' "$RUNNER_TEMP/second-start.log"
          INSTALL_DIR="$location" python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          installed = Path(os.environ["INSTALL_DIR"])
          auth = json.loads((installed / ".local-oauth.json").read_text())
          assert auth["resource"] == "http://localhost:18080/mcp"
          assert auth["human_client_id"] and auth["m2m_client_id"]
          assert auth["federated_granted"] and auth["workload_kid"]
          from pathlib import Path
          key = Path(auth["workload_key_path"])
          assert key.is_file() and key.stat().st_mode & 0o077 == 0
          assert key.parent != installed and key.parent.stat().st_mode & 0o077 == 0
          assert auth["m2m_client_secret"] and auth["human_granted"]
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open("http://localhost:1411/", timeout=5) as reply:
              assert reply.status == 200
              assert b"html" in reply.read(8192).lower()
          try:
              opener.open("http://localhost:1411/api/signup/setup", timeout=5)
          except urllib.error.HTTPError as err:
              assert err.code == 404, f"Unexpected setup status {err.code}"
          else:
              raise AssertionError("Initial admin setup remained available")
          print("REAL .run PASS: embedded UI, initial admin, idempotence, OAuth, wrong-secret denial")
          PY
          printf keep > "$RUNNER_TEMP/owner-data"
          mkdir "$RUNNER_TEMP/already-exists"
          cp "$RUNNER_TEMP/owner-data" "$RUNNER_TEMP/already-exists/owner-data"
          if POCKET_ID_INSTALL_DIR="$RUNNER_TEMP/already-exists" timeout 20s "$installer" >/dev/null 2>&1; then
            echo 'Existing user data was overwritten: FAIL'
            exit 1
          fi
          test "$(cat "$RUNNER_TEMP/already-exists/owner-data")" = keep
          cp "$installer" "$RUNNER_TEMP/tampered.run"
          printf corrupted >> "$RUNNER_TEMP/tampered.run"
          if POCKET_ID_INSTALL_DIR="$RUNNER_TEMP/tampered-install" timeout 20s "$RUNNER_TEMP/tampered.run" >/dev/null 2>&1; then
            echo 'Corrupted .run checksum not rejected: FAIL'
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/tampered-install"

      - name: Publish Linux .run as GitHub Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pocket-id-local-agent-linux-amd64-run
          path: dist/pocket-id-local-agent-linux-amd64.run
          if-no-files-found: error
          retention-days: 14
